general:
  fps: 60
  timezone: Asia/Yangon

video_vibration:
  baseline_sec: 0.25
  action_sec: 0.25
  action_start_frame_offset: 1
  windows:
    dynamic_action_enabled: true
    dynamic_offsets: [-2, -1, 0, 1, 2, 3, 4, 5, 6]
    dynamic_select_metric: "max_impulse"
  roi:
    adaptive_enabled: true
    adaptive_height_ratio: 0.45
    min_roi_h: 5
    max_roi_h: 18
    min_neighbor_distance_px: 4.0
    reject_if_neighbor_overlap: false
    reject_if_out_of_frame: false
  candidates:
    geometry_enabled: true
    geometry_top_k: 5
    geometry_max_distance_px: 35.0
    always_include_touched_id: true
    include_id_radius_fallback: true
    missing_touched_id_fallback: nearest_geometry
    fallback_top_k: 3
    fallback_max_distance_px: 40.0
    log_string_id_inconsistency: true
  frame_transitions:
    allow_small_gaps: true
    max_gap_frames: 2
    normalize_by_gap: true
  roi_h: 32
  roi_w: 160
  roi_thickness_px: 2
  center_band_h: 10
  trim_ends_ratio: 0.15
  farneback:
    pyr_scale: 0.5
    levels: 3
    winsize: 15
    iterations: 3
    poly_n: 5
    poly_sigma: 1.2
    flags: 0
  rules:
    z_thr: 2.35
    thr_peak: 4.0
    thr_duration_frames: 2
    thr_impulse: 7.0
    normalization_mode: robust_mad
    require_absolute_motion: true
    min_action_mean: 0.02
    min_action_max: 0.05
  domination:
    ratio: 1.2
  global_shake:
    thr_global_median_peak: 5.0
    thr_many_strings_vibrating: 6
    shake_probe_count: 6

audio:
  enabled: true
  decision_mode: onset_only # keep onset_only until instrument-specific tuning is available; onset_pitch_match needs a real tuning table
  sample_rate: 16000
  extract_audio: true
  onset_window_sec: 0.18 # tighter: reduce unrelated sounds after touch
  baseline_window_sec: 0.30 # more stable local noise baseline before touch
  onset_strength_hop: 256
  onset_threshold: 1.40 # z-score threshold for onset acceptance
  pitch_backend: torchcrepe
  pitch_window_sec: 0.12
  min_f0_hz: 60
  max_f0_hz: 1000
  min_pitch_conf: 0.50
  max_cents_error: 50
  require_cv_vibration_for_audio_strike: true
  candidate_radius_default: 2
  candidate_radius_close_contact: 1
  contact_dist_px_thr: 8
  tuning_table_path: configs/saung_tuning.json
  confidence_weights:
    onset_z: 1.2
    pitch_conf: 1.5
    cents_penalty: 1.0
    bias: -0.4

fusion:
  mode: av_fuse
  prefer_audio_when_conf_ge: 0.75
  prefer_video_when_audio_missing: true
  timing_source: hybrid
  confidence_thresholds:
    high: 0.80
    medium: 0.55

paths:
  legacy_strike_config_path: saung_strike_video_farneback_rules/configs/config.yaml
